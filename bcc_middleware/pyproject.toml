[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bcc-middleware"
version = "2.0.0"
description = "Behavioral Commitment Chain (BCC) Shield Middleware"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "uvicorn>=0.22.0",
]

[project.scripts]
bcc-middleware = "main:app"
