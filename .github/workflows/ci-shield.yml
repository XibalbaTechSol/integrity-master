name: CI Shield

on:
  push:
    paths:
      - 'xibalba-shield/**'
      - '.github/workflows/ci-shield.yml'
      - 'deployments.json'
  pull_request:
    paths:
      - 'xibalba-shield/**'
      - 'deployments.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: xibalba-shield/package-lock.json
      - name: Install dependencies
        working-directory: xibalba-shield
        run: npm ci
      - name: Lint
        working-directory: xibalba-shield
        run: npm run lint
      - name: Build
        working-directory: xibalba-shield
        run: npm run build
      
