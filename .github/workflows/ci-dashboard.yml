name: CI Dashboard

on:
  push:
    paths:
      - 'integrity-dashboard/**'
      - '.github/workflows/ci-dashboard.yml'
  pull_request:
    paths:
      - 'integrity-dashboard/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: integrity-dashboard/package-lock.json
      - name: Install dependencies
        working-directory: integrity-dashboard
        run: npm ci
      - name: Lint
        working-directory: integrity-dashboard
        run: npm run lint
      - name: Build
        working-directory: integrity-dashboard
        run: npm run build
