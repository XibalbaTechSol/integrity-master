name: CI SDK

on:
  push:
    paths:
      - 'integrity-sdk/**'
      - '.github/workflows/ci-sdk.yml'
  pull_request:
    paths:
      - 'integrity-sdk/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "integrity-sdk/pyproject.toml"
      - name: Run tests
        working-directory: integrity-sdk
        run: uv run pytest
