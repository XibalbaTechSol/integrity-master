[package]
name = "phi-provenance-service"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ring = "0.17"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"

[dev-dependencies]
actix-web = { version = "4", features = ["macros"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
http = "0.2"

